# ============================================================
# Fly.io — API Express du GSMD
# Secrets à poser avec `fly secrets set` (jamais dans ce fichier) :
#   DATABASE_URL, JWT_SECRET, SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY,
#   SUPABASE_SECRET_KEY, RESEND_API_KEY, CONTACT_EMAIL_TO,
#   CONTACT_EMAIL_FROM
# ============================================================
app = 'madeleinedanielou-api'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile.api'

[env]
  PORT = '4000'
  # À remplacer par le domaine Vercel réel après le premier déploiement
  CLIENT_URL = 'https://madeleinedanielou.vercel.app,https://www.madeleinedanielou.ci'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'
